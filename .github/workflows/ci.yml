name: CI

# Runs once per push to a pull request, and on master after a merge
# (docs/40-operations/environments.md#ci). A branch without a pull request
# gets no CI: open a draft one to have it checked.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format, unit tests, build
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only documents changed → the database and browser tests are skipped.
      - name: Anything besides documents changed?
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || git diff --name-only "$BASE" HEAD | grep -qvE '^(docs/|\.claude/|[^/]+\.md$)'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run ontology:check
      - run: npm run build

  database:
    name: Database tests (migrations from empty)
    needs: check
    if: needs.check.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase db start
      - run: supabase test db
      - name: Generated database types are up to date
        run: |
          supabase gen types typescript --local --schema core,food,shopping,fitness > /tmp/database.types.ts
          npx --yes prettier@3.9.9 --config .prettierrc.json --stdin-filepath src/data/database.types.ts < /tmp/database.types.ts > /tmp/formatted.ts
          diff -u src/data/database.types.ts /tmp/formatted.ts

  e2e:
    name: Browser tests (stand-in Supabase)
    needs: check
    # Pull requests only: master gets nothing a merge didn't already test.
    if: github.event_name == 'pull_request' && needs.check.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Playwright's own image, as scripts/e2e-docker.sh uses, so screenshots match.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:e2e
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
