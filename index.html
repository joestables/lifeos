<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Hex is required here: --background from theme.css, light and dark. -->
    <meta name="theme-color" content="#f3f4f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101012" media="(prefers-color-scheme: dark)" />
    <title>LifeOS</title>
    <!-- The app icon (docs/30-design/patterns.md#the-app-icon). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The first request to Supabase doesn't wait for a connection to be made. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <script>
      // Light or dark before the first paint: what Settings' Appearance
      // chose on this device (src/lib/theme.ts), else the system's.
      const dark = matchMedia('(prefers-color-scheme: dark)')
      const apply = () => {
        let kept = null
        try {
          kept = localStorage.getItem('lifeos.theme')
        } catch {}
        const on = kept === 'dark' || (kept !== 'light' && dark.matches)
        document.documentElement.classList.toggle('dark', on)
        if (kept === 'dark' || kept === 'light')
          for (const meta of document.querySelectorAll('meta[name="theme-color"]'))
            meta.content = on ? '#101012' : '#f3f4f5'
      }
      apply()
      dark.addEventListener('change', apply)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
