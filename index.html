<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Hex is required here: --background from theme.css, light and dark. -->
    <meta name="theme-color" content="#f3f4f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101012" media="(prefers-color-scheme: dark)" />
    <title>LifeOS</title>
    <!-- No app icon yet (pull-requests.md, "Left for later"). -->
    <link rel="icon" href="data:," />
    <script>
      // Follow the system's light or dark mode before the first paint.
      const dark = matchMedia('(prefers-color-scheme: dark)')
      const apply = () => document.documentElement.classList.toggle('dark', dark.matches)
      apply()
      dark.addEventListener('change', apply)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
